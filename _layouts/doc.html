<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666;
      --border: #e5e5e5;
      --link: #2563eb;
      --card: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --fg: #e6e6e6;
        --muted: #9aa0a6;
        --border: #2c2f36;
        --link: #6ea8fe;
        --card: #1d2026;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    a { color: var(--link); }
    .crumb { font-size: 0.9rem; margin-bottom: 2rem; }
    .crumb a { text-decoration: none; color: var(--muted); }
    .crumb a:hover { color: var(--link); }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.5rem; }
    h2 { font-size: 1.25rem; margin: 2rem 0 0.5rem; padding-top: 0.5rem; }
    h3 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    blockquote {
      margin: 1.25rem 0;
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 0 6px 6px 0;
    }
    blockquote p { margin: 0.25rem 0; }
    code {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.9em;
    }
    ul { padding-left: 1.25rem; }
    li { margin: 0.3rem 0; }
    .home-list { list-style: none; padding: 0; }
    .app-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin: 1rem 0;
      background: var(--card);
    }
    .app-card h2 { margin-top: 0; }
    .app-card .tagline { color: var(--muted); margin: 0 0 0.75rem; }
    .doc-links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
    footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    {% unless page.url == "/" %}
    <nav class="crumb"><a href="{{ '/' | relative_url }}">← All documents</a></nav>
    {% endunless %}
    <main>
      {{ content }}
    </main>
    <footer>
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </footer>
  </div>
</body>
</html>
